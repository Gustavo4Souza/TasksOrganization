name: Sync Vercel deployments

# Importa os deploys de produção da Vercel para os KPIs, a partir dos status
# "Vercel – <projeto>" nos commits do main (ver scripts/sync-vercel-deployments.mjs).
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # Sem "environment:": um job com environment cria um "deployment" falso no
    # GitHub a cada execução. Os secrets usados são do repositório.
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test sync logic
        run: node --test scripts/sync-vercel-deployments.test.mjs
      - name: Synchronize Vercel deployments
        env:
          KPI_API_URL: ${{ secrets.KPI_API_URL }}
          KPI_INGEST_SECRET: ${{ secrets.KPI_INGEST_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-vercel-deployments.mjs
