name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "30 2 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test security gate logic
        run: node --test scripts/check-sarif.test.mjs

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: ${{ runner.temp }}/codeql-results

      - name: Enforce security gate
        shell: bash
        run: |
          set -euo pipefail
          sarif_file="$(find "${{ runner.temp }}/codeql-results" -name '*.sarif' -print -quit)"
          if [[ -z "$sarif_file" ]]; then
            echo "CodeQL did not produce a SARIF result file."
            exit 1
          fi

          node scripts/check-sarif.mjs "$sarif_file"
