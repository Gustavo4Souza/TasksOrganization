name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O dist:win builda só o desktop; num runner limpo, @tasksorg/core e
      # @tasksorg/ui ainda não têm dist/. O Turborepo builda as dependências antes (^build).
      - name: Build desktop and its workspace dependencies
        run: pnpm turbo run build --filter=@tasksorg/desktop

      - name: Build Windows installer
        run: pnpm --filter @tasksorg/desktop dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: tasksorg-windows-installer
          path: apps/desktop/release/*
          if-no-files-found: error
