<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>TasksOrg — Desktop (POC)</title>
    <link rel="stylesheet" href="../dist/tokens.css" />
    <style>
      @font-face {
        font-family: "Silkscreen";
        src: url("./fonts/Silkscreen-Regular.ttf") format("truetype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Silkscreen";
        src: url("./fonts/Silkscreen-Bold.ttf") format("truetype");
        font-style: normal;
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: "Pixelify Sans";
        src: url("./fonts/PixelifySans%5Bwght%5D.ttf") format("truetype");
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
      }
      @font-face {
        font-family: "Jersey 10";
        src: url("./fonts/Jersey10-Regular.ttf") format("truetype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      :where(button, input, select):focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      body {
        margin: 0;
        font-family: "Pixelify Sans", sans-serif;
        background: var(--bg);
        color: var(--ink);
        padding: 1.5rem 2rem;
      }
      h1 { font-family: "Silkscreen", sans-serif; font-size: 1.4rem; margin-bottom: 0; }
      .subtitle { color: var(--ink-muted); margin-top: 0.25rem; }
      section {
        margin-top: 1.5rem;
        padding: 1rem 1.25rem;
        border: 2px solid var(--edge);
        background: var(--surface);
      }
      .task-form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      .task-form input { flex: 1; padding: 0.5rem; border: 1px solid var(--edge); background: var(--surface-sunken); color: var(--ink); }
      button {
        font-family: "Silkscreen", sans-serif;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 8px;
        background: var(--gold);
        color: var(--on-accent);
        cursor: pointer;
      }
      button.secondary { background: var(--surface-raised); color: var(--ink); }
      ul { list-style: none; padding: 0; margin: 0; }
      li {
        display: flex;
        justify-content: space-between;
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--edge-soft);
      }
      li.done .title { text-decoration: line-through; color: var(--ink-muted); }
      .pomodoro { text-align: center; }
      .time { font-family: "Jersey 10", sans-serif; font-size: 2.5rem; font-weight: 400; font-variant-numeric: tabular-nums; }
      .phase { text-transform: uppercase; font-size: 0.75rem; color: var(--mana); letter-spacing: 0.08em; }
      .controls { margin-top: 0.75rem; display: flex; gap: 0.5rem; justify-content: center; }
    </style>
  </head>
  <body>
    <h1>TasksOrg</h1>
    <button id="theme-toggle" type="button" aria-label="Alternar tema">Alternar tema</button>
    <p class="subtitle">POC Desktop (Electron) — mesma lógica de @tasksorg/core usada na web</p>

    <section>
      <h2>Tarefas</h2>
      <form class="task-form" id="task-form">
        <label class="sr-only" for="task-input">Título da nova tarefa</label>
        <input type="text" id="task-input" placeholder="Nova tarefa..." maxlength="160" required />
        <button type="submit">Adicionar</button>
      </form>
      <ul id="task-list"></ul>
    </section>

    <section class="pomodoro">
      <h2>Pomodoro</h2>
      <p class="phase" id="pomodoro-phase">Foco</p>
      <p class="time" id="pomodoro-time">25:00</p>
      <div class="controls">
        <button id="btn-start">Iniciar</button>
        <button class="secondary" id="btn-pause">Pausar</button>
        <button class="secondary" id="btn-reset">Resetar</button>
      </div>
    </section>

    <script src="../dist/renderer.js"></script>
  </body>
</html>
