apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tasksorg
spec:
  selector:
    app: tasksorg-api
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tasksorg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasksorg-api
  template:
    metadata:
      labels:
        app: tasksorg-api
    spec:
      containers:
        - name: api
          image: ghcr.io/gustavo4souza/tasksorg-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: TRUST_PROXY
              value: "1"
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: tasksorg-config
                  key: ALLOWED_ORIGINS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tasksorg-secrets
                  key: DATABASE_URL
            - name: KPI_INGEST_SECRET
              valueFrom:
                secretKeyRef:
                  name: tasksorg-secrets
                  key: KPI_INGEST_SECRET
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
