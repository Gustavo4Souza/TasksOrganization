apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tasksorg
spec:
  type: LoadBalancer
  selector:
    app: tasksorg-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tasksorg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tasksorg-web
  template:
    metadata:
      labels:
        app: tasksorg-web
    spec:
      containers:
        - name: web
          image: ghcr.io/gustavo4souza/tasksorg-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
